# Wood Vintage — production vhost (stage 2, after the certificate exists).
# One domain serves every market (/in, /us, ...). Nginx is the ONLY trusted proxy: it overwrites
# X-Forwarded-For so the backend's geo lock (GEO_TRUST_PROXY=true) sees the real visitor address.

map $http_accept $wv_img_fmt {
    default          orig;
    "~*image/avif"   avif;
    "~*image/webp"   webp;
}

upstream wv_api { server 127.0.0.1:5000; keepalive 32; }
upstream wv_web { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name thewoodvintage.com www.thewoodvintage.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://thewoodvintage.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thewoodvintage.com;
    ssl_certificate     /etc/letsencrypt/live/thewoodvintage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thewoodvintage.com/privkey.pem;
    return 301 https://thewoodvintage.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thewoodvintage.com;

    ssl_certificate     /etc/letsencrypt/live/thewoodvintage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thewoodvintage.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # PRE-LAUNCH: keep the demo out of search engines. REMOVE THIS LINE AT GO-LIVE.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 110m;      # > MAX_VIDEO_SIZE (100 MB)
    limit_conn wv_conn 40;

    # never expose dotfiles (e.g. the /uploads/.derivatives cache)
    location ~ /\.(?!well-known) { deny all; }

    # ---- API ----
    location ~ ^/api/v1/auth/ {
        limit_req zone=wv_auth burst=10 nodelay;
        include /etc/nginx/wv-proxy.conf;
        proxy_pass http://wv_api;
    }
    location = /api/v1/leads {
        limit_req zone=wv_lead burst=5 nodelay;
        include /etc/nginx/wv-proxy.conf;
        proxy_pass http://wv_api;
    }
    location /api/ {
        limit_req zone=wv_api burst=60 nodelay;
        include /etc/nginx/wv-proxy.conf;
        proxy_pass http://wv_api;
        proxy_read_timeout 120s;
    }

    # ---- images: content-addressed derivatives, cached at the edge ----
    location /img/ {
        include /etc/nginx/wv-proxy.conf;
        proxy_pass http://wv_api;
        proxy_cache wv_img;
        proxy_cache_key "$uri$is_args$args|$wv_img_fmt";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }
    location /uploads/ {
        alias /var/lib/wood-vintage/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ---- storefront + admin (Next.js) ----
    location /_next/static/ {
        include /etc/nginx/wv-proxy.conf;
        proxy_pass http://wv_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        include /etc/nginx/wv-proxy.conf;
        proxy_pass http://wv_web;
        proxy_read_timeout 60s;
    }
}
