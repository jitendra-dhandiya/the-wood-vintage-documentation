# Stage 1: HTTP only, answers ACME challenges until the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name thewoodvintage.com www.thewoodvintage.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 "Wood Vintage - coming soon\n"; add_header Content-Type text/plain; }
}
