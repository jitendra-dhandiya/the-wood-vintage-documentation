# Shared proxy headers. $wv_xff (see nginx-site.conf map) is the caller's address, EMPTY for this server's own
# public IP: Next SSR fetching the API via the public URL is internal traffic, not a visitor to geo-lock.
# Shared proxy headers (cont.). X-Forwarded-For is OVERWRITTEN (not appended) so clients cannot spoof their
# location to the geo lock. Only nginx may reach the upstreams (ufw blocks 3000/5000 from outside).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $wv_xff;
proxy_set_header X-Forwarded-For $wv_xff;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header cf-ipcountry "";
proxy_set_header x-vercel-ip-country "";
