# Shared proxy headers. X-Forwarded-For is OVERWRITTEN (not appended) so clients cannot spoof their
# location to the geo lock. Only nginx may reach the upstreams (ufw blocks 3000/5000 from outside).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header cf-ipcountry "";
proxy_set_header x-vercel-ip-country "";
